    - Linux kernel 5.13+ (network support in 6.7+)
  limitations:
    - Filesystem only in early kernel versions
    - Must combine with seccomp for full coverage
    - Linux only
  notes: >-
    The modern Linux answer to unprivileged sandboxing. Network support in
