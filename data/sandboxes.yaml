- name: Beam
  category: cloud-managed
  maintainer: Beam Cloud
  open_source: true
  license: AGPL-3.0
  url: https://www.beam.cloud/sandbox
  repo_url: https://github.com/beam-cloud/beta9
  description: Serverless AI compute platform whose Sandbox API runs LLM-generated code in gVisor or runc containers with optional GPUs, Docker-in-Docker, snapshots and preview URLs; the open-source beta9 runtime is self-hostable.
  isolation_type: [gvisor, container]
  capabilities:
    - beta9 pkg/runtime selects runc or runsc (gVisor) per config, with gVisor platform kvm, systrap or ptrace
    - '"Sandboxes cold boot in 1-3 seconds, even with dependencies included" (vendor docs); image caching for faster reboots'
    - Filesystem snapshots and restart; memory snapshots for fork and resume
    - GPU attachment (A10G, H100 or other supported GPUs) in the sandbox constructor
    - Docker-in-Docker; pull from any registry and run containers inside the sandbox
    - Network isolation with CIDR allow lists; preview URLs expose ports behind SSL-terminated authenticated endpoints
    - Python, Node.js and arbitrary shell commands; configurable auto-shutdown or indefinite runtime
    - BYOC on AWS/GCP/Azure/Hetzner and self-hosting of beta9 (vendor blog)
  requirements:
    - Beam account for the managed cloud
    - Own infrastructure to self-host beta9
  limitations:
    - Isolation runtime is vendor-stated in a Beam blog post ("gVisor + runc"), not in the Sandbox product docs; the beta9 source confirms both backends exist but not which the hosted service uses
    - BYOC is described in a blog post; no dedicated BYOC page was found in the sandbox docs
    - beta9 is AGPL-3.0, which constrains network-service redistribution for self-hosters
    - Managed control plane is proprietary; open_source refers to the beta9 runtime
  notes: >-
    Nearest to Modal (serverless functions plus sandboxes) but with an
    open-source, AGPL runtime you can run yourself, which Modal lacks; unlike
    E2B and Daytona the isolation is gVisor/runc containers rather than
    Firecracker microVMs. SOC 2 Type II is shown in the site footer; YC-backed;
    $30 free credit refreshed monthly. Blog posts state the gVisor+runc
    choice was made for lighter operation than microVMs.
  isolation_tier: container
  adoption_effort: sign-up
  deployment_model: cloud

- name: Blaxel
  category: cloud-managed
  maintainer: Blaxel
  open_source: false
  license: null
  url: https://blaxel.ai
  repo_url: null
  description: Managed microVM sandboxes for agents with a tmpfs/OverlayFS writable root over an EROFS base image, standby snapshots preserving memory state, persistent volumes and a shared Agent Drive filesystem.
  isolation_type: [microvm]
  capabilities:
    - '"MicroVM-based sandboxes" that "resume in ~25ms" with memory state intact (vendor)'
    - Automatic standby after roughly 15 s of inactivity; standby is billed for snapshot/volume storage only
    - Writable root filesystem lives in memory (tmpfs, about 50% of RAM reserved) and is wiped when the sandbox is destroyed
    - Snapshots persist indefinitely; archive mode stores the filesystem without memory state
    - Volumes persist independently of sandbox lifecycle; Agent Drive mounts one filesystem across many sandboxes
    - Sandboxes built from Docker images; MCP servers can be hosted the same way
    - TypeScript and Python SDKs; region selection; CPU allocated proportionally to memory (8GB = 4 cores)
  requirements:
    - Blaxel account (up to $200 free credits, no card)
  limitations:
    - Proprietary platform; hypervisor behind "microVM" is not named in docs
    - About half of RAM is reserved for the in-memory filesystem
    - Starter quotas enforce TTL-based deletion; unlimited persistence only on higher tiers
    - Reserved ports 80, 443 and 8080 cannot be used by workloads
  notes: >-
    Competes directly with E2B and Daytona; the differences are the
    memory-preserving standby (idle sandboxes cost storage only and resume
    with process state) and the multi-sandbox Agent Drive. Compliance claims
    on the homepage: SOC 2 Type II, HIPAA, ISO 27001. Named customers include
    Webflow, Strapi and Shortwave. YC-backed, San Francisco, founded 2024.
    SDK repositories were not checked; repo_url left null.
  isolation_tier: microvm
  adoption_effort: sign-up
  deployment_model: cloud

