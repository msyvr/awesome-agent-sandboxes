- name: landrun
  category: standalone
  maintainer: Zouuup
  open_source: true
  license: MIT
  url: https://github.com/Zouuup/landrun
  repo_url: https://github.com/Zouuup/landrun
  description: Go CLI that wraps a single Linux command in a Landlock ruleset with per-path read/write/exec rules and TCP bind/connect port restrictions, without root, containers, or seccomp.
  isolation_type: [landlock]
  capabilities:
    - Per-path filesystem rules (--ro, --rox, --rw, --rwx), accepting files or directories
    - TCP bind and connect restricted to listed ports (Landlock ABI v4, kernel 6.7+)
    - IPC scoping of abstract UNIX sockets and signals on by default (ABI v6+); pathname UNIX socket connect allowlist via --unix (ABI v9+)
    - Landlock denial audit logging flags (ABI v7+)
    - --best-effort degrades to the highest Landlock ABI the running kernel supports
    - Empty environment by default; --env passes variables individually
    - --ldd and --add-exec auto-add the target binary and its shared libraries to the exec allowlist
    - Packaged in Ubuntu (26.04), Debian forky, AUR, and SlackBuilds
  requirements:
    - Linux kernel 5.13+ with Landlock enabled (6.7+ for TCP rules, 6.12+ for IPC scoping)
    - Go 1.24+ to build from source, or a distro package
  limitations:
    - Landlock only; no seccomp syscall filtering, no PID or mount namespaces, no UDP or ICMP control
    - Not agent-specific; no agent profiles, credential handling, or audit chain, so the caller must compose full path lists by hand
    - No hostname- or HTTP-level network rules; network control is by TCP port only
  notes: >-
    General-purpose Landlock wrapper (the README positions it as a lighter firejail) rather than an
    agent tool. It sits between the Landlock LSM entry, which is the raw kernel primitive, and nono,
    which layers Landlock and seccomp with agent profiles, a credential proxy, and rollback. landrun's
    value for agent use is a one-line, dependency-free confinement of any command on stock distro
    kernels, and it is now in Debian and Ubuntu archives. About 2,300 GitHub stars at inclusion; sole
    maintainer.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

- name: sandlock
  category: standalone
  maintainer: multikernel
  open_source: true
  license: Apache-2.0
  url: https://github.com/multikernel/sandlock
  repo_url: https://github.com/multikernel/sandlock
  description: Rust process sandbox for Linux combining Landlock, seccomp-BPF, and a seccomp user-notification supervisor to confine agent code with HTTP-level network ACLs and a copy-on-write working directory, without root or containers.
  isolation_type: [landlock, seccomp, process]
  capabilities:
    - Landlock filesystem, TCP port, and IPC scoping rules plus a seccomp-BPF deny filter applied before exec
    - Outbound network allowlist or denylist by host, IP, CIDR, port, and protocol (tcp, udp, icmp), enforced at connect/sendto via seccomp notification
    - HTTP-level ACLs (method + host + path) through a transparent proxy; HTTPS via an ephemeral CA injected into the trust bundle or a user-supplied CA
    - Credential injection in the proxy after the ACL check, so the child never holds the API key
    - Copy-on-write working directory via syscall interception (no mount namespace), with --dry-run to preview file changes and discard them
    - Port virtualization so multiple sandboxes bind the same port; named sandboxes with ps/inspect/kill
    - Dynamic policy callbacks (policy_fn) in Python or Rust evaluated at syscall time on execve, connect, bind, and openat
    - Memory and process-count limits, frozen time and seeded randomness, and an OCI runtime shim (sandlock-oci) for containerd/CRI-O
  requirements:
    - Linux 6.12+ for full features (Landlock ABI v6); 5.13+ for filesystem rules only
    - Rust 1.70+ to build (cargo install); no root, no cgroups
  limitations:
    - Build from source only; no prebuilt binaries or distro packages documented
    - "Vendor claims ~5 ms startup and ~1,900 COW forks/sec in the README comparison table; not independently measured"
    - Shared host kernel; the README lists a TOCTOU caveat for seccomp-notify and excludes path strings from policy_fn events for that reason
    - Full network and IPC confinement requires a 6.12+ kernel, newer than many LTS distros ship
  notes: >-
    Closest to nono (Landlock + seccomp, credential proxy) and to Anthropic sandbox-runtime srt
    (domain proxy), but sandlock adds a seccomp user-notify supervisor that implements the COW
    filesystem, resource limits, port remapping, and runtime policy callbacks without namespaces,
    and its HTTP ACL scopes by method and path rather than by domain alone. It also ships Python,
    Go, and C FFI bindings and an OCI shim, so the same core can back an SDK or a Kubernetes
    runtime class. Active repository at inclusion (about 1,090 commits, pushes on the day of
    review); the multikernel org is the maintainer.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

- name: ai-jail
  category: standalone
  maintainer: akitaonrails
  open_source: true
  license: GPL-3.0-only
  url: https://github.com/akitaonrails/ai-jail
  repo_url: https://github.com/akitaonrails/ai-jail
  description: Rust launcher that runs coding agents under bubblewrap plus Landlock, seccomp, and rlimits on Linux, or sandbox-exec on macOS, with an ephemeral tmpfs home and opt-in credential mounting.
  isolation_type: [user-namespace, landlock, seatbelt]
  capabilities:
    - Fresh tmpfs $HOME per launch; agent credential state (~/.claude, ~/.claude.json) mounted only with --agent-state
    - Network, GPU, display, X11, host /dev/shm, Docker socket, SSH, and systemd user bus all default off with paired --x/--no-x flags
    - Minimal environment allowlist; --env forwards single variables, env_pass in trusted global config
    - --mask replaces project secrets (.env, *.pem) with empty placeholders; --deny-path hides them entirely
    - Layered config where project ./.ai-jail can only tighten policy and ~/.ai-jail is the trusted layer that can grant capabilities
    - Isolated browser profiles (--browser), copy-on-write overlay maps on Linux, mise toolchain activation inside the sandbox
    - Terminal output filtered through a VT parser by default; raw passthrough is opt-in
    - Ships via Homebrew, AUR, crates.io, Nix flake, and signed GitHub releases
  requirements:
    - Linux with bubblewrap installed (unprivileged user namespaces enabled), or macOS with sandbox-exec
    - Rust 1.97 to build from source; no Windows support (WSL2 only)
  limitations:
    - The README states it is "a useful layer, not a replacement for a disposable VM when running hostile code" and does not protect against kernel, driver, or terminal-emulator vulnerabilities
    - GPL-3.0-only copyleft; relevant if embedding in a distributed product
    - macOS backend uses the deprecated sandbox-exec interface and has no mount namespace, so /tmp is the host's
    - --allow-tcp-port fails closed by design; network is all-or-nothing (--network), with no domain or port allowlist
  notes: >-
    Same bwrap-plus-Seatbelt base as Anthropic sandbox-runtime srt and fence, but ai-jail's
    distinguishing choices are a default private tmpfs home with credentials excluded unless
    requested, a monotonic project config that a repository cannot use to loosen policy, and secret
    masking for files inside the writable project tree. Unlike srt it has no domain proxy, so
    network is either off or unrestricted. About 1,180 GitHub stars at inclusion; maintained by
    Fabio Akita (akitaonrails) with pushes in the week of review.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

- name: Leash
  category: standalone
  maintainer: StrongDM
  open_source: true
  license: Apache-2.0
  url: https://leash.strongdm.ai/
  repo_url: https://github.com/strongdm/leash
  description: Docker/Podman wrapper from StrongDM that runs a coding agent in a container while a sidecar container observes syscalls and enforces Cedar policies on file, exec, network, and MCP tool-call activity.
  isolation_type: [container]
  capabilities:
    - Cedar policies (permit/forbid) transpiled at load time into eBPF LSM rules and HTTP MITM proxy rules; forbid rules block, not just log
    - Policy actions cover FileOpen (ro/rw), ProcessExec by path, NetworkConnect by host or IP:port, HttpRewrite, and McpCall
    - MCP observer records and enforces tool calls on supported transports, correlated with file and network telemetry
    - Full filesystem and network telemetry with a Control UI (localhost:18080) including a Monaco Cedar editor with completion and validation
    - Live policy updates over HTTP API or the UI without restarting the agent
    - Default coder image ships claude, codex, gemini, qwen, and opencode; custom images supported
    - Prompted, remembered decisions on mounting host agent config directories and forwarding provider API keys
    - Experimental native macOS mode via Endpoint Security and Network Extension system extensions (no container)
  requirements:
    - Docker, Podman, or OrbStack on macOS or Linux (WSL supported)
    - Install via npm (@strongdm/leash), Homebrew cask, or release binary
  limitations:
    - Last commit 2026-04; 5 months idle at inclusion
    - Starts with a permissive policy; enforcement is opt-in by authoring Cedar rules
    - McpCall forbid is enforced but permit is informational only (v1); ProcessExec matches by path with no argument filtering; hostname rules require the proxy (kernel enforces IP only); IPv6 literals and CIDR unsupported in v1
    - Native macOS mode is described by the project as highly experimental and requires approving system extensions and Full Disk Access
  notes: >-
    The Cedar question is settled by docs/design/CEDAR.md, which states policies are transpiled to
    Leash IR and loaded into eBPF LSM programs and the MITM proxy, so forbid rules deny actions
    rather than only log them, with the MCP permit exception noted above. Compared with
    agent-glovebox (Docker plus monitor and credential scoping) Leash's distinguishing pieces are a
    formal policy language with a linted subset and the MCP tool-call layer; compared with clampdown
    it enforces via eBPF LSM from a sidecar rather than via Landlock and seccomp inside the agent
    container. Ships from a commercial vendor (StrongDM) under Apache-2.0 with a binary-distribution
    disclaimer stating no support or maintenance is provided.
  isolation_tier: container
  adoption_effort: install
  deployment_model: local

- name: agent-sandbox.nix
  category: standalone
  maintainer: archie-judd
  open_source: true
  license: MIT
  url: https://github.com/archie-judd/agent-sandbox.nix
  repo_url: https://github.com/archie-judd/agent-sandbox.nix
  description: Nix library and flake templates that wrap an agent binary in bubblewrap (Linux) or sandbox-exec (macOS) with declared paths, an ephemeral home, a domain- and method-filtering HTTP proxy, and read-only git hooks and config.
  isolation_type: [user-namespace, seatbelt]
  capabilities:
    - Declarative mkSandbox arguments for rwDirs/rwFiles/roDirs/roFiles, allowedPackages (PATH allowlist), and env passthrough
    - allowedDomains routes HTTP/HTTPS through a filtering proxy with per-domain HTTP method lists; DNS and WebSockets blocked when active
    - Host loopback blocked by default; allowedLocalPorts opens specific TCP ports
    - Ephemeral tmpfs $HOME; host environment cleared except declared variables
    - Git .git/hooks, config, config.worktree, and worktree/submodule pointer files mounted read-only to prevent host code execution via git
    - Symlinks in declared paths resolve only to already-permitted targets, preventing sandbox expansion between sessions
    - Per-launch session directory logging bwrap args, seatbelt profile, firewall rules, and blocked proxy requests
    - Flake templates for Claude Code and GitHub Copilot CLI
  requirements:
    - Nix with flakes (or nix-shell) on Linux or macOS
    - bubblewrap-capable Linux (unprivileged user namespaces) or macOS with sandbox-exec
  limitations:
    - Requires adopting Nix; the wrapper is built per-project via flake.nix or shell.nix
    - The README states the agent can edit flake.nix inside the writable project directory and weaken its own next session, and that a launch from $HOME exposes the whole home
    - On macOS, gh and other Go tools reject the proxy certificate when allowedDomains is set; sandbox-exec is deprecated
    - All of /nix/store is readable (allowedPackages restricts execution only); allowNix exposes the daemon socket and weakens the sandbox
  notes: >-
    Same bwrap/Seatbelt plus domain-proxy shape as Anthropic sandbox-runtime srt, but expressed as
    Nix derivation arguments so the sandbox definition is reproducible and version-pinned with the
    agent binary itself. Specific to this entry are HTTP-method filtering per domain, read-only git
    metadata against hook injection, and the symlink-target check. The README's own similar-projects
    list names srt, jail.nix, jailed-agents, and ai-jail. About 150 GitHub stars at inclusion; sole
    maintainer, pushes in the week of review; v1.x renamed several arguments from v0.x.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

