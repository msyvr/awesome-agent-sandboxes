- name: Claude Code Sandbox
  category: agent-integrated
  maintainer: Anthropic
  open_source: false
  license: null
  url: https://code.claude.com/docs/en/sandboxing
  repo_url: null
  description: Native OS-level sandboxing using bubblewrap (Linux) and Seatbelt/sandbox-exec (macOS), reducing permission prompts by 84%.
  isolation_type: [user-namespace, seatbelt]
  capabilities:
    - Filesystem isolation (CWD read/write, block writes elsewhere)
    - Network isolation (proxy-based domain allowlisting)
    - OS-level enforcement
  requirements:
    - Claude Code CLI
    - macOS or Linux
  limitations:
    - dangerouslyDisableSandbox escape hatch can be triggered by agent itself
    - macOS sandbox-exec deprecated by Apple
    - Shared kernel
  notes: >-
    Demonstrated escape by Ona (March 2026) via dangerouslyDisableSandbox flag.
    Uses bubblewrap on Linux, Seatbelt on macOS — different mechanisms per OS.
  isolation_tier: process
  adoption_effort: zero-config
  deployment_model: built-in

- name: OpenAI Codex Sandbox
  category: agent-integrated
  maintainer: OpenAI
  open_source: false
  license: null
  url: https://developers.openai.com/codex/concepts/sandboxing
  repo_url: null
  description: "Two modes: cloud (isolated containers, internet disabled during agent phase) and local CLI (Landlock + seccomp on Linux)."
  isolation_type: [container, landlock, seccomp]
  capabilities:
    - "Cloud: isolated containers, two-phase runtime (setup with network, then offline agent)"
    - "Cloud: per-project network lists, secrets removed before agent"
    - "Local: Landlock + seccomp, workspace-only writes"
  requirements:
    - "Cloud: OpenAI account + GitHub"
    - "Local: Linux kernel 5.13+"
  limitations:
    - Cloud requires GitHub integration
    - Local is Linux-only
    - Network disabled by default in agent phase
  notes: >-
    Only major agent with sandboxing enabled by default. Two-phase model
    (online setup, offline agent) is a unique security architecture — the agent
    never has network access during execution.
  isolation_tier: container
  adoption_effort: zero-config
  deployment_model: built-in

