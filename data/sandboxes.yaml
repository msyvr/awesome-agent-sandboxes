    sandboxed tools via MCP from OCI registries. Microsoft backing.
    Released Aug 2025.
  isolation_tier: wasm
  adoption_effort: compose
  deployment_model: local

- name: Pyodide
  category: wasm-runtime
  maintainer: Pyodide community (Mozilla origin)
  open_source: true
  license: MPL-2.0
  url: https://github.com/pyodide/pyodide
  repo_url: https://github.com/pyodide/pyodide
  description: CPython compiled to WebAssembly providing browser-grade sandbox security for Python execution.
  isolation_type: [wasm]
  capabilities:
    - Full CPython in Wasm
    - Browser-grade isolation
    - Supports NumPy, Pandas, and other scientific packages
  requirements:
    - Browser or Wasm runtime
  limitations:
    - Python only
    - Not all C extensions supported
    - No native filesystem or network access
    - Performance overhead vs. native CPython
  notes: >-
    Good for sandboxing Python-only agent code execution where you need
    browser-grade isolation guarantees without running a VM.
  isolation_tier: wasm
  adoption_effort: compose
  deployment_model: local

- name: Capsule
  category: wasm-runtime
  maintainer: Capsule (capsulerun)
  open_source: true
  license: Apache-2.0
  url: https://github.com/capsulerun/capsule
  repo_url: https://github.com/capsulerun/capsule
  description: CLI and SDK that compile Python or TypeScript/JavaScript tasks to WebAssembly and run them on Wasmtime/WASI under CPU-fuel, memory and timeout limits with filesystem and domain allowlists.
  isolation_type: [wasm]
  capabilities:
    - Compiles Python 3.13+ and TypeScript/JavaScript (Node.js 22+, npm packages and ES modules) to Wasm modules run on Wasmtime with WASI
    - CPU limited by Wasmtime fuel metering with LOW/MEDIUM/HIGH presets or a custom value
    - Per-task memory cap (e.g. 512MB, 2GB) and timeout (e.g. 30s, 5m); optional automatic retries
    - Filesystem access only to directories in allowed_files, each read-only or read-write
    - Network access only to domains in allowed_hosts; default is none
    - Environment variables passed only if listed in env_variables
    - capsule build precompiles to .wasm/.cwasm so execution skips the compiler
    - Installable via pip (capsule-run) or npm (@capsule-run/cli); host-side run() API in Python
  requirements:
    - Python 3.13+ and/or Node.js 22+ on the host
    - Rust toolchain only when building from source
  limitations:
    - Python packages with C extensions need a wasm32-wasi wheel; README states numpy and pandas do not work inside the sandbox
    - Running .py/.ts source directly adds "a few seconds" of compile latency on first call (README); sub-second start requires a precompiled artifact
    - Last commit 2026-06; about 2.5 months idle at inclusion, small project (~300 stars)
  notes: >-
    Sits between Wasmtime (a bare runtime with no language toolchain) and
    Wassette (MCP-served Wasm components you must compile yourself): Capsule
    bundles the Python and JS-to-Wasm compilers and a per-task policy of
    files, hosts, env, fuel, memory and timeout. Unlike Pyodide it runs
    server-side on Wasmtime with fuel metering rather than in a browser.
    Maintained by a small French team; PyPI at 0.8.x.
  isolation_tier: wasm
  adoption_effort: install
  deployment_model: local

- name: Eryx
  category: wasm-runtime
  maintainer: Ben Sully (eryx-org)
  open_source: true
  license: MIT OR Apache-2.0
  url: https://docs.eryx.run
  repo_url: https://github.com/eryx-org/eryx
  description: Wasmtime sandbox embedding full CPython 3.14 compiled to WASI, with memory, CPU-fuel and timeout limits, no filesystem or network by default, and host-controlled async callbacks for permitted access.
  isolation_type: [wasm]
  capabilities:
    - Full CPython 3.14 (componentize-py WASI build), so the standard library and pure-Python wheels run unmodified
    - Configurable memory caps, CPU fuel limits and execution timeouts
    - Isolated virtual filesystem by default with opt-in read-only or read-write host directory mounts
    - Networking disabled by default; opt-in TCP/TLS with host allowlists, blocklists and connection limits, plus secret substitution only in HTTP requests to authorized hosts
    - Host callbacks exposed as awaitable Python async functions; concurrent calls via asyncio.gather
    - Session state persists across executions; dill-based state snapshots for capture and restore
    - SandboxPool with min/max size, pre-warming and idle eviction; preinit feature captures initialized memory for faster creation
    - Bindings for Python (pyeryx on PyPI), JavaScript (@bsull/eryx on npm) and Rust (eryx crate); loads .whl/.tar.gz packages including WASI-compiled native extensions
  requirements:
    - Python, Node.js or Rust host toolchain for the respective binding
  limitations:
    - Native extension support (e.g. numpy via late-linking) is marked experimental in the README feature table
    - No default values for memory, fuel or timeout are documented; you must choose them
    - Single primary maintainer (473 of roughly 600 commits by one author; the rest are dependency bots)
    - '"Used in production at Grafana" is a README self-statement; the maintainer lists Grafana Labs as employer on GitHub, but Grafana has not been asked to confirm'
  notes: >-
    Closest in spirit to monty and Pyodide but different from both: monty is a
    Rust reimplementation of a Python subset, Pyodide is CPython-in-Wasm aimed
    at browsers, while Eryx runs the real CPython 3.14 on server-side Wasmtime
    with fuel metering, host-policed sockets and an async callback bridge.
    Compared with Capsule it offers no JavaScript guest and no CLI, but adds
    sessions, snapshots and pooling for REPL-style agent loops. Dual MIT and
    Apache-2.0 license files are present. PyPI 0.6.0; pushed 2026-09.
  isolation_tier: wasm
  adoption_effort: install
  deployment_model: local

- name: Amla Sandbox
  category: wasm-runtime
  maintainer: Amla Labs
  open_source: true
  license: MIT AND (AGPL-3.0-or-later OR BUSL-1.1)
  url: https://github.com/amlalabs/amla-sandbox
  repo_url: https://github.com/amlalabs/amla-sandbox
  description: Python package running agent-written JavaScript and shell inside a bundled Rust WASM/WASI runtime where every tool call is checked against explicit capability grants and a parameter-constraint DSL.
  isolation_type: [wasm]
  capabilities:
    - pip install amla-sandbox ships the runtime as amla_sandbox.wasm; README states no Docker or VM required
    - Guest languages JavaScript and shell (language="javascript" / "shell")
    - Tools are host Python functions exposed only when passed to the sandbox; the guest can call nothing else
    - ToolCallCap grants match method patterns (e.g. stripe/charges/*) and carry a ConstraintSet DSL such as Param("amount") <= 10000 or Param("currency").is_in([...])
    - Constraints can also bound call frequency
    - Sandboxed virtual filesystem; no network access; no shell escape
    - Integration modules for LangGraph and CodeAct-style agents plus an audit module in the package source
  requirements:
    - Python 3 host with the amla-sandbox package
  limitations:
    - Python package is MIT; the bundled Rust runtime is "AGPL-3.0-or-later OR BUSL-1.1" (README); the amla-sandbox-core repo has no LICENSE file detected by GitHub
    - Release mirror of a monorepo; README warns pull requests here are clobbered on the next release
    - Last commit 2026-05; about 3.5 months idle at inclusion (v0.2.8 on 2026-05-15)
    - No Python guest execution documented; only JavaScript and shell examples
  notes: >-
    Inverts the Wassette model: there the tools are compiled to Wasm and the
    agent calls them; here the agent's own code runs in Wasm and tools stay
    as host Python functions gated by per-call constraints. Capsule and Eryx
    bound resources (fuel, memory, files, hosts); Amla's distinctive control
    is authorization of individual tool arguments. Around 345 stars; the
    docs directory contains a research report rather than reference docs.
  isolation_tier: wasm
  adoption_effort: install
  deployment_model: local
