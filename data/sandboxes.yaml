- name: clampdown
  category: standalone
  maintainer: 89luca89
  open_source: true
  license: GPL-3.0-only
  url: https://github.com/89luca89/clampdown
  repo_url: https://github.com/89luca89/clampdown
  description: Launcher by the distrobox author that confines Claude Code, Codex, or OpenCode in a zero-capability Podman/Docker container with Landlock, seccomp, iptables egress rules, and OCI hooks that re-apply the same restrictions to nested tool containers.
  isolation_type: [container, landlock, seccomp]
  capabilities:
    - Agent container with cap-drop=ALL, read-only rootfs, no-new-privileges, and a seccomp profile blocking about 150 syscalls (io_uring, userfaultfd, BPF, namespace creation, mount)
    - Landlock ruleset applied by sandbox-seal before exec (workdir RW, system dirs RO); Landlock V3 (kernel 6.2+) is a hard requirement
    - Sidecar-owned iptables egress; agent default-deny with domain allowlist, tool containers default-allow with private CIDRs always blocked; rules changed live with clampdown network
    - OCI precreate and createRuntime hooks validate every nested podman run against 17 checks and derive Landlock policy from its bind mounts; no opt-out
    - Auth proxy in a FROM scratch container holds real API keys; the agent receives a dummy sk-proxy key
    - Sidecar seccomp-notify supervisor with SHA-256 exec allowlist, mount and firewall-modification blocking
    - Protected workdir paths (.git/hooks, .git/config, .claude, .mcp.json) read-only; .env, .npmrc, .clampdownrc masked; optional inotify tripwire kills the session on tamper
    - Structured audit log per session (policy PASS/BLOCKED, proxy requests, firewall changes) persisted after container removal
  requirements:
    - Linux kernel 6.2+ with Landlock (6.12+ recommended), natively or inside podman machine or colima
    - Rootless podman (preferred), Docker, or nerdctl; Go 1.23+ to build; Docker Desktop on macOS unsupported
  limitations:
    - GPL-3.0-only copyleft (COPYING.md), relevant if redistributing
    - Egress domains resolve to IPs when a rule is applied, so rotating CDN addresses can break allowed hosts or require wider CIDRs; no HTTP path or method scoping
    - Build from source with make all (five container images); the sidecar runs with 16 capabilities including SYS_ADMIN and NET_ADMIN
    - Under 100 GitHub stars at inclusion; young project despite the maintainer's distrobox track record
  notes: >-
    Combines what agent-glovebox does with Docker and credential scoping and what nono does with
    Landlock plus a key proxy, and adds a layer neither has, which is OCI hooks and a sidecar
    supervisor that apply identical confinement to containers the agent itself spawns for builds and
    tests. That nested-container enforcement, the FROM scratch sidecar and proxy images, and the
    seccomp-notify exec allowlist are the distinguishing mechanisms. Written by Luca Di Maio
    (distrobox); pushes on the day of review.
  isolation_tier: container
  adoption_effort: install
  deployment_model: local

- name: clawker
  category: standalone
  maintainer: schmitthub
  open_source: true
  license: AGPL-3.0-or-later
  url: https://docs.clawker.dev
  repo_url: https://github.com/schmitthub/clawker
  description: Go CLI that runs Claude Code or Codex in capability-less Docker containers behind a deny-by-default egress stack of Envoy, a custom CoreDNS, and eBPF cgroup redirection, with domain, path, and method rules enforced via TLS MITM.
  isolation_type: [container]
  capabilities:
    - Agent containers run with no Linux capabilities; clawkerd as PID 1 drops to an unprivileged user
    - eBPF cgroup programs attached from outside the container redirect TCP to Envoy and DNS to CoreDNS; unlisted domains return NXDOMAIN
    - Per-domain TLS MITM certificates enabling HTTP path- and method-level allow rules and a per-request audit log
    - Per-host control plane container owning firewall lifecycle, eBPF programs, agent identity registry, and mTLS gRPC to each clawkerd
    - Live firewall add/remove/refresh, per-agent disable, and timed bypass (clawker firewall bypass 5m)
    - SSH and GPG agent forwarding over muxrpc instead of copying credentials; host proxy relays browser OAuth flows back into the container
    - Git worktree per agent with .git/hooks and .git/config masked read-only; harness bundles for adding other agent CLIs
    - Optional OpenTelemetry stack (OTel Collector, OpenSearch, Dashboards, Prometheus) on the same Docker network
  requirements:
    - Docker on macOS or Linux; Homebrew, install script, or Go 1.26+ to build
    - Docker network with control-plane, Envoy, and CoreDNS containers running alongside agents
  limitations:
    - AGPL-3.0-or-later with a commercial dual license and CLA; network-use clause applies to hosted modifications
    - Heavy footprint (control plane, Envoy, CoreDNS, eBPF loader, optional four-service monitoring stack) for a local single-user tool
    - README states early development stage with breaking changes expected, and that Linux is less exercised than macOS
    - No seccomp, Landlock, or AppArmor confinement inside the container; the README lists syscall filtering as roadmap
  notes: >-
    Occupies the same Docker-wrapper slot as agent-glovebox and clampdown but inverts their emphasis
    by putting all enforcement at the network edge, with name-based rules matched at request time
    rather than IPs pinned in iptables (clampdown) and no kernel syscall filtering. The README's
    comparison table rates competitors including nono, Anthropic sandbox-runtime srt, and Docker
    Sandboxes, so treat its own column with the usual caution. Solo maintainer, about 50 GitHub
    stars at inclusion, pushes in the week of review; a Claude Code support plugin ships separately
    under MIT.
  isolation_tier: container
  adoption_effort: install
  deployment_model: local

- name: mcp-runner
  category: standalone
  maintainer: Tangier AI (abir-taheer)
  open_source: true
  license: Apache-2.0
  url: https://github.com/abir-taheer/mcp-runner
  repo_url: https://github.com/abir-taheer/mcp-runner
  description: NestJS service that deploys dockerized MCP servers into gVisor (runsc) containers with dropped capabilities, isolated networks, and unprivileged users, exposing each over Streamable HTTP/SSE including STDIO-only servers.
  isolation_type: [container, gvisor]
  capabilities:
    - Every deployment container is created with Runtime runsc; setup.sh installs gVisor and registers it in the Docker daemon
    - Drops SYS_ADMIN, NET_ADMIN, SYS_PTRACE, SYS_MODULE; no-new-privileges and apparmor docker-default
    - Per-deployment bridge network with inter-container communication disabled; DNS pinned to 8.8.8.8 and 1.1.1.1
    - Each container runs as a unique unprivileged Linux user created on the host
    - Memory and CPU limits and deleteAfterSeconds per deployment via REST API with X-API-Key auth and Swagger docs
    - Converts STDIO MCP servers to remote Streamable HTTP or SSE endpoints
    - Full cleanup of containers, networks, users, and logs on deletion
  requirements:
    - Ubuntu 24.04 VM (2 GB RAM minimum) provisioned by setup.sh with Docker and runsc
    - The runner itself runs as a privileged container with the Docker socket and host /etc mounted
  limitations:
    - Last commit 2025-12 (last push 2026-01); 7 months idle at inclusion
    - gVisor is required, not optional; the runtime is hardcoded to runsc in container.service.ts and there is no compose file or flag to select another runtime
    - Deployment containers run with seccomp:unconfined (gVisor filters syscalls instead); the control service needs --privileged, host networking, and docker.sock
    - Around 30 GitHub stars; single-company project (Tangier AI) with the image published as tangierai/mcp-runner
  notes: >-
    Sandboxes MCP servers rather than the agent, the same target as Kilntainers but with the
    opposite direction of trust, since here untrusted third-party MCP servers are the workload and
    the agent connects to them remotely. Nearest listed isolation primitive is gVisor; nearest
    products are E2B and Modal style hosted runners, which this replaces with a single self-managed
    VM. The privileged control container and host /etc mount mean the runner host itself is a
    trusted single-tenant machine.
  isolation_tier: container
  adoption_effort: compose
  deployment_model: self-hosted

- name: vetto
  category: standalone
  maintainer: shleder
  open_source: true
  license: Apache-2.0
  url: https://github.com/shleder/vetto
  repo_url: https://github.com/shleder/vetto
  description: Daemon-less Rust single binary that wraps any agent CLI in Landlock, namespaces, and a hand-built seccomp-BPF filter on Linux, or a Seatbelt profile on macOS, with a host-side DNS broker for per-domain network allowlists.
  isolation_type: [landlock, seccomp, user-namespace, seatbelt]
  capabilities:
    - Landlock rulesets built via raw syscalls with ABI 1-6 probing, including read-path denial and IPC scoping
    - Hand-built seccomp-BPF filter blocking non-Unix socket(), mount-family syscalls, and io_uring
    - User, mount, PID, network, and IPC namespaces without bwrap or root
    - Network modes off / per-domain allowlist / open; a host-side broker resolves DNS, checks the allowlist and forbidden CIDRs, connects, and passes the socket fd into the sandbox over SCM_RIGHTS
    - In-project secret paths masked with /dev/null bind mounts or empty tmpfs
    - PATH shims (vetto enable claude|codex|cursor), Git Guard intercepting destructive git commands, and vetto mcp wrap for third-party MCP servers
    - Ephemeral run-and-rollback mode, session snapshots and diff review, PTY secret redactor
  requirements:
    - Linux 5.13+ (Landlock) or macOS
    - "cargo install vetto or npm i -g @shledery/vetto"
  limitations:
    - Repository created 2026-08 with a single author and no external audit at inclusion; the git history shows ~600 commits in three weeks (renamed from codex-rescue)
    - macOS profile enforces write and network restrictions only; the README attributes missing read denial to an Apple SBPL regression, which conflicts with srt, nono, and fence all denying reads via Seatbelt unprivileged — unverified
    - Windows backend (Job Objects / AppContainer) is experimental
    - Bundles a large non-isolation feature set (TUI, reports, token-burn watchdog) alongside the sandbox
  notes: >-
    Author-submitted (PR #62); the isolation code was read before inclusion:
    landlock.rs, seccomp_netblock.rs, namespaces.rs, and net_relay.rs implement
    what the README claims. Nearest entries are nono (Landlock+seccomp with a
    credential proxy and rollback) and srt/fence (bwrap or Seatbelt with an
    HTTP-level domain proxy). What differs is the network path: the broker
    connects on the host and hands a connected socket across the boundary,
    so no resolver or raw socket exists inside the sandbox. No new kernel
    property — a denser native combination of existing ones, from a very
    young codebase.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

