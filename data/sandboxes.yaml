- name: netclode
  category: kubernetes
  maintainer: angristan (Stanislas Lange)
  open_source: true
  license: null
  url: https://github.com/angristan/netclode
  repo_url: https://github.com/angristan/netclode
  description: Self-hosted coding-agent service running each Claude Code, Codex, Copilot, or OpenCode session in a Kata Containers microVM on Cloud Hypervisor under k3s, with a native iOS and macOS client.
  isolation_type: [kata, microvm]
  capabilities:
    - Warm pool of pre-booted Kata VMs claimed per session; default 4 vCPU and 4 GB RAM per VM
    - JuiceFS on S3 (Redis metadata) holds workspace, Docker data, and SDK session; pause deletes the VM and resume remounts the storage
    - Secret proxy outside the sandbox injects API keys for allowed hosts so keys never enter the VM
    - Tailscale operator for ingress, preview URLs, and port forwarding; Kubernetes NetworkPolicy for sandbox egress
    - Auto-snapshots after each turn with rollback of workspace and chat to any prior point
    - GitHub App integration with per-repo scoped tokens and an @mention bot for PRs and issues
    - Optional local inference via Ollama; Docker available inside the VM
  requirements:
    - Linux VPS or server with nested virtualization (README lists DigitalOcean and Vultr as working, Hetzner Cloud not)
    - k3s provisioned by the included Ansible playbooks; S3 bucket, Tailscale OAuth, and LLM API keys
  limitations:
    - No LICENSE file (all rights reserved by default)
    - Solo maintainer (833 of 898 non-bot commits); built as a personal tool per the README
    - Native client is SwiftUI targeting iOS 26 and macOS; no web client
    - JuiceFS over S3 has low small-file IOPS without the documented writeback and virtiofs caching
  notes: >-
    netclode is an end-to-end product (control plane, agent runner, bot, mobile app) rather than a
    sandbox primitive, so it compares with Fly Sprites or a self-hosted Claude Code web rather than
    with Kata or k7 directly. Its secret proxy applies the same idea as nono's credential proxy and
    Anthropic sandbox-runtime's domain proxy at the cluster edge. The missing license means the code
    can be read but not legally redistributed or modified without the author's permission.
  isolation_tier: microvm
  adoption_effort: compose
  deployment_model: kubernetes

- name: k8e
  category: kubernetes
  maintainer: xiaods (Deshi Xiao)
  open_source: true
  license: Apache-2.0
  url: https://k8e.sh
  repo_url: https://github.com/xiaods/k8e
  description: Single-binary Kubernetes distribution built on K3s components that adds a sandbox gateway, warm pod pools, snapshots, and Cilium egress policy for agent sessions under gVisor, Kata, or Firecracker runtime classes.
  isolation_type: [gvisor, kata, container]
  capabilities:
    - Sandbox gateway over gRPC with mTLS plus an E2B-compatible HTTP surface (pkg/sandbox/e2b) for sessions, exec, files, PTY terminals, expose, and snapshots
    - Auto-detects installed runsc, Kata, or firecracker-containerd shims and registers RuntimeClasses; gVisor is the recommended default
    - Warm pool of pre-booted sandbox pods with adaptive sizing
    - Content-addressed snapshots (SHA-256 layerstore, zstd, incremental restore, server-side registry)
    - Per-session Cilium toFQDNs egress policy and live allow-hosts changes
    - k8e-sandbox-cli standalone binary for Linux, macOS, Windows that installs a /k8e-sandbox skill into Claude Code, Codex, and Pi
    - Prometheus metrics, NDJSON event stream, file-backed exec transcripts
  requirements:
    - Linux host (x86_64, ARM64, RISC-V); gVisor runsc for the default runtime, nested virt or bare metal for Kata, /dev/kvm for Firecracker
    - API key created on the server with k8e sandbox-apikey create
  limitations:
    - Solo maintainer (1586 of ~1660 commits); the sandbox layer is recent relative to the 2020 repo
    - "Vendor claims: sub-500ms warm-pool claims and per-runtime boot times (gVisor ~10 ms, Kata ~500 ms, Firecracker ~125 ms) are README figures without published methodology"
    - Firecracker setup is manual (firecracker-containerd shim, devmapper snapshotter, kernel and rootfs placed by hand)
    - go.mod replaces containerd, cadvisor, and cri-dockerd with k3s-io forks, so it tracks K3s upstream rather than vanilla Kubernetes
  notes: >-
    k8e differs from kubernetes-sigs Agent Sandbox in that it is the cluster: one binary installs K3s,
    containerd, the runtime classes, and the gateway, whereas Agent Sandbox is a set of CRDs and
    controllers you add to an existing cluster (k8e states it is compatible with them). Against
    OpenSandbox and AgentScope Runtime it is closer to E2B's surface, since the official E2B SDKs are
    the intended client. The repository began in 2020 as a K3s-inspired distribution and was rebranded
    to the agent-sandbox use case; adoption signals for the sandbox features specifically are thin.
  isolation_tier: container
  adoption_effort: install
  deployment_model: kubernetes

