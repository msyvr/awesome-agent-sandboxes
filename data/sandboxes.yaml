- name: loop
  category: agent-integrated
  maintainer: radutopala (Radu Topala)
  open_source: true
  license: Apache-2.0
  url: https://github.com/radutopala/loop
  repo_url: https://github.com/radutopala/loop
  description: Multi-platform (desktop, Slack, Discord) Claude Code runner that traps syscalls inside Docker containers via seccomp RET_USER_NOTIF and routes each trap to a three-button chat approval card, with a body-filtering Docker API proxy as a second gate.
  isolation_type: [container, seccomp]
  capabilities:
    - Hand-written seccomp BPF filter via RET_USER_NOTIF traps 12 syscalls (connect, execve, execveat, openat, openat2, renameat2, unlinkat, linkat, symlinkat, fchmodat, fchownat, mkdirat)
    - ERRNO-denies io_uring family (closes seccomp bypass)
    - PR_SET_NO_NEW_PRIVS + TSYNC; arch-locked with kill-process on mismatch
    - Trap blocks in kernel's seccomp_do_user_notification until chat click resolves
    - Three-button approval cards (once / session / deny / deny-session) routed to Slack or Discord
    - Per-container Approval Manager caches session decisions; rate limits
    - Docker HTTP proxy with JSONPath-lite body filtering on POST /containers/create
    - Symlink-resolved bind-mount source paths to defeat /workdir/link bind-escape
    - Bundles Claude Code; desktop, Slack, and Discord front-ends
  requirements:
    - Linux (seccomp RET_USER_NOTIF is Linux-only)
    - Docker
  limitations:
    - Solo maintainer; project ~3 months old at time of inclusion
    - Approval UX depends on a responsive operator or session-cached "allow"
    - macOS and Windows not supported
  notes: >-
    Differentiator vs commodity Docker-tier entries is the seccomp
    RET_USER_NOTIF + chat-routed HITL approval stack: kernel-parked traps
    resume only on SECCOMP_IOCTL_NOTIF_SEND with the CONTINUE flag, with
    path arguments read via process_vm_readv and symlink-resolved before the
    chat card is rendered. README credits agentsh for design inspiration;
    novel axis here is HITL governance via team chat rather than CLI
    prompts. ~11,500 LOC with a 1:1 test ratio despite low star count —
    code is production-grade on the security-critical paths.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

- name: OneCLI
  category: agent-integrated
  maintainer: OneCLI
  open_source: true
  license: Apache-2.0
  url: https://onecli.sh
  repo_url: https://github.com/onecli/onecli
  description: Per-employee agent platform that runs each agent in a Docker container on an internal network whose only route out is a Rust MITM gateway that injects credentials and enforces team policy.
  isolation_type: [container]
  capabilities:
    - Runner starts, parks, and reaps agent containers on an internal Docker network (no route out) pinned with no-new-privileges, CapDrop ALL, and the default seccomp profile
    - Rust gateway intercepts outbound HTTP and HTTPS (MITM) and injects credentials matched by host and path pattern; agents hold only Proxy-Authorization access tokens
    - Bitwarden or 1Password vault integration for on-demand injection with nothing stored on the server
    - Deterministic human-in-the-loop approvals in chat for designated actions
    - Identity-provider provisioning of one agent per employee; dashboard and per-agent Slack app
    - Secret store encrypted AES-256-GCM at rest; SSH front door with short-lived certificates into sandboxes
    - Runner is outbound-only, so sandboxes can run on a laptop, homelab, or VPC behind NAT
  requirements:
    - Docker host for the runner plus PostgreSQL; pnpm run setup or the install script generates Docker Compose configuration
    - Company account on onecli.sh for the hosted variant
  limitations:
    - Docker is the only shipped runtime backend (RUNNER_BACKEND=docker or fake); the runner README lists Fly, k8s, and microVMs as future substrates
    - Nested containers inside a sandbox are deliberately inert under the Docker backend; the README says they work only on the hosted microVM substrate
    - ee/ directories are under the OneCLI Enterprise License, requiring a subscription for production use; contributions require a CLA
    - Created 2026-03; the sandboxing model relies on Docker's shared kernel plus network egress control rather than VM isolation
  notes: >-
    OneCLI began as a Rust credential vault for agents and pivoted (v2) to a team platform; the
    company also sells a hosted version. Its credential-injecting egress gateway is the same
    mechanism as nono's credential proxy and agent-glovebox's credential scoping, applied at team
    scale with IdP provisioning and approvals. The isolation boundary is a hardened Docker container
    on an internal network, weaker than Docker Sandboxes' microVM or the microVM entries; the value
    is the policy and secrets plane rather than the sandbox itself.
  isolation_tier: container
  adoption_effort: install
  deployment_model: self-hosted

