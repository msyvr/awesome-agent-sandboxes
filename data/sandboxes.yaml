- name: Declaw
  category: cloud-managed
  maintainer: Declaw
  open_source: false
  license: null
  url: https://declaw.ai
  repo_url: https://github.com/declaw-ai
  description: Firecracker microVM sandboxes fronted by a host-side egress proxy in each sandbox's network namespace that enforces IP, SNI and TLS-inspection policy, injects vault-held credentials, redacts PII and writes audit logs.
  isolation_type: [microvm]
  capabilities:
    - Firecracker microVMs with independent filesystem, process tree and network namespace; warm-pool restore in "tens of milliseconds" (vendor)
    - Security proxy runs host-side, outside the guest, as the only egress path, so the workload cannot bypass or tamper with it
    - Network policy from kernel-level IP/CIDR filtering through SNI domain matching (exact, wildcard, regex) to TLS interception on chosen domains using a per-sandbox CA
    - Credential vault (OpenBao server-side) injects secrets into outbound requests via vault_refs; the value never enters the VM
    - PII detection (SSNs, cards, emails, phones) with block/strip/log actions and rehydration in responses
    - Audit events for every egress decision, redaction and policy block, exposed via console and API
    - Guardrails refuse dangerous commands and block cloud-metadata/IMDS endpoints
    - Open-source SDKs for Python, TypeScript and Go, CLI, MCP server, n8n and Dify plugins (Apache-2.0) and the cagecheck escape tester (MIT)
  requirements:
    - Declaw account for api.declaw.ai ($300 free credits) or an enterprise on-prem engagement
  limitations:
    - Platform is proprietary; only SDKs, CLI, MCP server and cagecheck are open
    - Homepage advertises Terraform modules for AWS and GCP self-hosting, but the deployment docs describe on-prem as a sales-led enterprise engagement
    - SOC 2 and HIPAA appear only in a sales contact card; no certification is stated
    - Response bodies are passed through without injection scanning (security-proxy docs); guardrails fall back to a regex scanner if the guardrails service is unreachable
  notes: >-
    The proxy-side secret injection resembles sandcat (Docker tier) and the
    credential proxy in nono, but Declaw pairs it with Firecracker isolation
    and moves the proxy off the guest entirely, adding TLS interception, PII
    redaction and a queryable audit trail. cagecheck, a static binary that
    reports escape vectors from inside any sandbox, is usable independently
    of the platform. All GitHub org repositories date from 2026; young
    vendor.
  isolation_tier: microvm
  adoption_effort: sign-up
  deployment_model: cloud

- name: Freestyle
  category: cloud-managed
  maintainer: Freestyle
  open_source: false
  license: null
  url: https://www.freestyle.sh
  repo_url: https://github.com/freestyle-sh
  description: Full Linux VMs for agents with root and nested KVM, live-forked while running, hibernated with memory preserved and billed for storage only while paused, controlled through SDKs and a bash API.
  isolation_type: [kvm]
  capabilities:
    - Root access; docs list nested virtualization, FUSE, eBPF and full networking; homepage states "full KVM support" for VMs inside VMs and Docker
    - 'Vendor claims "65ms from API request to ready machine" (homepage) and "p99s under 400ms" (docs)'
    - 'Live forking: "Clone a running VM without pausing it" (vendor)'
    - Hibernation keeps exact memory state; a paused VM bills only for storage
    - Snapshots with minimal interruption for branching and cloning; shared base snapshots do not count toward quota
    - Up to 32 vCPU, 64 GiB RAM and 256 GB disk on Pro; larger via enterprise
    - Free plan includes 200 vCPU-hours, 400 GiB-memory-hours and 60,000 GiB-storage-hours per month as hard allowances
  requirements:
    - Freestyle account
  limitations:
    - Platform proprietary; the open repositories (rigkit CLI/SDK, Adorable, Cloudstate, all MIT) are adjacent tooling rather than the VM runtime
    - Provisioning figures differ between homepage (~65ms) and docs (p99 under 400ms); neither was measured here
    - Nested KVM and live fork are verified only as vendor statements on the homepage and docs overview
    - Free tier is capped with no overage; usage stops when allowances are exhausted
  notes: >-
    Same shape as Fly Sprites and Box (full VMs rather than microVM
    sandboxes) but with two claims the others do not make: nested KVM inside
    the guest and forking a VM without pausing it. Compared with E2B the
    unit is a long-lived machine you hibernate, not an ephemeral sandbox.
    Customers named on the homepage include Onlook, Wordware and HeroUI;
    investors Floodgate, Y Combinator, Hustle Fund and Two Sigma Ventures.
  isolation_tier: hardware-vm
  adoption_effort: sign-up
  deployment_model: cloud

