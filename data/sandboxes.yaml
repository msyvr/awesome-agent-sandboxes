    - Smaller community
  notes: >-
    macOS support via Apple Virtualization.framework is unique among VM
    runtimes — Firecracker and Kata are Linux-only. Used by microsandbox.
  isolation_tier: hardware-vm
  adoption_effort: compose
  deployment_model: self-hosted

- name: Zeroboot
  category: vm-runtime
  maintainer: Zeroboot (community)
  open_source: true
  license: null
  url: https://github.com/zerobootdev/zeroboot
  repo_url: https://github.com/zerobootdev/zeroboot
  description: Sub-millisecond VM sandboxes via COW forking of Firecracker snapshots (~0.8ms fork creation).
  isolation_type: [kvm, microvm]
  capabilities:
    - KVM isolation
    - Firecracker snapshot COW forking
    - ~0.8ms sandbox creation
    - Self-hostable
    - Managed API also available
  requirements:
    - Linux with KVM
  limitations:
    - Very new
    - Small community
  notes: >-
    0.8ms sandbox creation via COW forking is remarkable if verified at scale.
    Worth watching as a potential next-gen approach to sandbox provisioning.
  isolation_tier: hardware-vm
  adoption_effort: compose
  deployment_model: self-hosted

# =============================================================================
# OS-Level Sandboxing (Building Blocks)
# =============================================================================

- name: bubblewrap (bwrap)
  category: os-primitive
  maintainer: Containers project (Flatpak origin)
  open_source: true
  license: LGPL-2.0+
  url: https://github.com/containers/bubblewrap
  repo_url: https://github.com/containers/bubblewrap
  description: Unprivileged user-namespace sandbox for Linux requiring no root, used by Claude Code and Flatpak.
  isolation_type: [user-namespace]
  capabilities:
    - User namespaces
    - Mount namespaces
    - Network namespace
    - No root required
  requirements:
    - Linux with user namespace support
  limitations:
    - Linux only
    - Low-level (must compose with other tools)
  notes: >-
    Years of hardening via Flatpak. Claude Code's Linux sandbox builds on this.
    The go-to unprivileged sandbox primitive on Linux.
  isolation_tier: process
  adoption_effort: compose
  deployment_model: local

- name: macOS Seatbelt / sandbox-exec
  category: os-primitive
  maintainer: Apple
  open_source: false
  license: null
  url: null
  repo_url: null
  description: macOS mandatory access control using SBPL policies for filesystem, network, and process restrictions.
  isolation_type: [seatbelt]
  capabilities:
    - Filesystem access control
    - Network control
    - Process restrictions
    - Kernel-level enforcement
  requirements:
    - macOS only
  limitations:
    - sandbox-exec deprecated by Apple
    - SBPL policy language poorly documented
  notes: >-
    Deprecated but still the only game in town for macOS process sandboxing.
    Used by Claude Code, Agent Safehouse, and srt on macOS. No replacement
    announced by Apple.
  isolation_tier: process
  adoption_effort: compose
  deployment_model: local

- name: Firejail
  category: os-primitive
  maintainer: netblue30 (community)
  open_source: true
  license: GPL-2.0
  url: https://github.com/netblue30/firejail
  repo_url: https://github.com/netblue30/firejail
  description: SUID sandbox combining namespaces, seccomp, and capabilities with desktop-aware features (audio, display).
  isolation_type: [user-namespace, seccomp]
  capabilities:
    - Namespace isolation
    - seccomp-BPF filtering
    - Filesystem whitelisting
    - Network filtering
    - Desktop app support (audio, display)
    - Pre-built profiles for common apps
  requirements:
    - Linux
    - Setuid binary
  limitations:
    - SUID is a larger attack surface
    - Desktop-focused
    - Linux only
  notes: >-
    Primarily for desktop app sandboxing, but applicable to agent processes.
    SUID requirement is a trade-off — convenience vs. attack surface.
  isolation_tier: process
  adoption_effort: install
  deployment_model: local

- name: Landlock LSM
  category: os-primitive
  maintainer: Linux kernel community
  open_source: true
  license: GPL-2.0
  url: https://landlock.io
  repo_url: null
  description: Unprivileged filesystem access control at kernel level, used by Codex CLI and NVIDIA OpenShell.
  isolation_type: [landlock]
  capabilities:
    - Filesystem access restrictions per path
    - Unprivileged (no root)
    - Stackable with other LSMs
    - Kernel-level enforcement
  requirements:
    - Linux kernel 5.13+ (network support in 6.7+)
  limitations:
    - Filesystem only in early kernel versions
    - Must combine with seccomp for full coverage
    - Linux only
  notes: >-
    The modern Linux answer to unprivileged sandboxing. Network support in
    kernel 6.7 makes it much more complete. Used by Codex CLI and OpenShell.
  isolation_tier: process
  adoption_effort: compose
  deployment_model: local

- name: seccomp-BPF
  category: os-primitive
  maintainer: Linux kernel community
  open_source: true
  license: GPL-2.0
  url: null
  repo_url: null
  description: Syscall filtering using BPF programs to kill, trap, or errno on forbidden syscalls.
  isolation_type: [seccomp]
  capabilities:
    - Syscall-level filtering
    - BPF programmability
    - Kill/trap/errno on forbidden syscalls
  requirements:
    - Linux kernel 3.5+
  limitations:
    - Syscall-level only (no file path awareness)
    - Complex BPF filter authoring
    - Linux only
  notes: >-
    Building block, not standalone. Almost always used alongside Landlock or
    namespaces to provide full sandbox coverage.
  isolation_tier: process
  adoption_effort: compose
  deployment_model: local

- name: Linux Namespaces + cgroups
  category: os-primitive
  maintainer: Linux kernel community
  open_source: true
  license: GPL-2.0
  url: null
  repo_url: null
  description: Foundation of all container technology — PID, mount, network, user, UTS, and IPC namespaces plus cgroups for resource limits.
  isolation_type: [user-namespace]
  capabilities:
    - Process isolation (PID namespace)
    - Filesystem isolation (mount namespace)
    - Network isolation (network namespace)
    - User isolation (user namespace)
    - CPU/memory/IO limits (cgroups)
  requirements:
    - Linux
  limitations:
    - Building blocks only — must compose into usable tools
    - Shared kernel
    - Linux only
  notes: >-
    Everything in the container and VM space builds on these primitives.
    Understanding namespaces and cgroups is foundational to evaluating any
    Linux-based sandbox's isolation claims.
  isolation_tier: process
  adoption_effort: compose
  deployment_model: local

- name: nsjail
  category: os-primitive
  maintainer: Google
  open_source: true
  license: Apache-2.0
  url: https://github.com/google/nsjail
  repo_url: https://github.com/google/nsjail
  description: Process isolation tool combining namespaces, seccomp, and resource limits with the Kafel policy language.
  isolation_type: [user-namespace, seccomp]
  capabilities:
    - Namespace isolation
    - seccomp-BPF filtering
    - cgroup resource limits
    - chroot/pivot_root
    - Network filtering
    - Kafel policy language
  requirements:
    - Linux
  limitations:
    - Linux only
    - Less actively maintained
    - CLI only
  notes: >-
    Google-maintained. Kafel policy language is more ergonomic than raw
    seccomp-BPF. Used by competitive programming judges for untrusted
    code execution.
  isolation_tier: process
  adoption_effort: compose
  deployment_model: local

