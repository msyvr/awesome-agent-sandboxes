- name: E2B
  category: cloud-managed
  maintainer: E2B
  open_source: true
  license: Apache-2.0
  url: https://e2b.dev
  repo_url: https://github.com/e2b-dev/E2B
  description: Cloud sandbox platform for AI agents using Firecracker microVMs via API/SDK.
  isolation_type: [microvm]
  capabilities:
    - Firecracker microVM isolation
    - ~150ms startup
    - Filesystem isolation
    - Network control
    - Python/JS/TS SDKs
    - Custom templates
  requirements:
    - Cloud-hosted managed service
    - Free tier available
