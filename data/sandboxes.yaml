# Canonical structured data for all sandbox entries.
# See the plan for schema documentation and controlled vocabularies.
#
# isolation_type values: kvm, microvm, container, gvisor, kata, v8-isolate,
#   user-namespace, seatbelt, landlock, seccomp, wasm, process
#
# isolation_tier values: hardware-vm, microvm, container, process, wasm
# adoption_effort values: zero-config, sign-up, install, compose
# deployment_model values: cloud, local, built-in, self-hosted, kubernetes

