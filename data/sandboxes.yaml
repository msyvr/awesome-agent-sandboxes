- name: Containarium
  category: self-hosted-platform
  maintainer: FootprintAI
  open_source: true
  license: Apache-2.0
  url: https://containarium.dev
  repo_url: https://github.com/FootprintAI/Containarium
  description: Self-hostable agent runtime that gives each agent a persistent, SSH-reachable LXC/Incus box with per-tenant network isolation and an in-box MCP server; Kubernetes and LXC backends with GPU passthrough.
  isolation_type: [container]
  capabilities:
    - Persistent, SSH-reachable LXC/Incus box per agent
    - Per-tenant network isolation (agent holds an SSH key, not a kube-apiserver token)
    - Userspace SOCKS5 egress proxy for network policy
    - MCP-native admin CLI plus a second MCP server running inside the box
    - Kubernetes and LXC/Incus backends
    - GPU passthrough
    - Port exposure to the public internet
  requirements:
    - Linux with LXC/Incus, or Kubernetes
    - Go 1.25 to build
    - Self-hosted
  limitations:
    - eBPF egress policy is experimental (under experimental/); the enforced egress path is the SOCKS5 proxy
    - In-box file-ops sandbox (AGENTBOX_ROOT) is opt-in, default-off
    - Container isolation (shared kernel)
  notes: >-
    SSH-native per-tenant LXC/Incus boxes; blast radius is bounded by an SSH
    key rather than a cluster token. Ships two MCP servers (host admin and an
    in-box shell_exec). The tagline advertises eBPF egress, but that code is
    experimental — the shipping egress control is a userspace SOCKS5 proxy.
  isolation_tier: container
  adoption_effort: install
  deployment_model: self-hosted

- name: warren
  category: self-hosted-platform
  maintainer: jayminwest
  open_source: true
  license: MIT
  url: https://github.com/jayminwest/warren
  repo_url: https://github.com/jayminwest/warren
  description: Self-hostable control plane and UI for ephemeral coding agents; each run executes in a native bubblewrap sandbox, validates, pushes a branch, and spins down, with live event streaming, mid-run steering, and human sign-off / PR-merge-gated dispatch.
  isolation_type: [user-namespace]
  capabilities:
    - Native bubblewrap-isolated workspace per run (host unreachable)
    - Control plane reaches the sandbox runtime over a unix socket with a bearer token
    - Live NDJSON event streaming
    - Mid-run steering (POST /steer)
    - Human sign-off gates that arm dispatch
    - Serial plan-run dispatch gated on prior-PR merges
    - Built-in claude-code agent plus a steerable alternative harness
    - Single container/volume/HTTP API/UI; optional Postgres backend
  requirements:
    - Docker (single container), or Fly.io / a cluster
    - A GitHub repo URL and a prompt
  limitations:
    - Early (v0.6.2); org-readiness features (SSO, remote workers, MCP, audit, budgets) on the roadmap
    - Process-level isolation (bubblewrap), shared kernel
  notes: >-
    Unlike control planes that delegate isolation to a cloud backend, warren
    ships its own bubblewrap sandbox — the host is unreachable and the control
    plane talks to the runtime over a unix socket. The differentiator is the
    governance layer (mid-run steering, sign-off gates, PR-merge-gated serial
    dispatch) on native isolation. 33 scenario-based acceptance tests; runs on
    Fly.io.
  isolation_tier: process
  adoption_effort: install
  deployment_model: self-hosted

- name: CubeSandbox
  category: self-hosted-platform
  maintainer: Tencent Cloud
  open_source: true
  license: Apache-2.0
  url: https://github.com/TencentCloud/CubeSandbox
  repo_url: https://github.com/TencentCloud/CubeSandbox
  description: Self-hostable microVM sandbox service built on RustVMM and KVM, E2B-SDK-compatible, creating hardware-isolated sandboxes in under 60ms with copy-on-write snapshot, clone, and rollback.
  isolation_type: [microvm, kvm]
  capabilities:
    - RustVMM + KVM microVM per sandbox (hardware-level isolation)
    - "Sandbox creation <60ms with <5MB memory overhead (vendor benchmarks)"
    - E2B-compatible SDK (PyPI cubesandbox)
    - CubeCoW copy-on-write engine — event-level snapshots, instant clone, rollback to any saved state
    - Credential vault — agents call external APIs while keys never enter the sandbox
    - Per-sandbox traffic tokens and policy-routing egress
    - AutoPause/AutoResume for idle sandboxes
    - Single-node, multi-node cluster, Kubernetes, and Terraform deployment; ARM64 support
  requirements:
    - Linux hosts with KVM
    - Self-hosted
  limitations:
    - v0.x (first open-source release April 2026); fast-moving surface
    - License is Tencent's Apache-2.0 variant with third-party carve-outs (SPDX NOASSERTION on GitHub)
  notes: >-
    Missed by keyword discovery despite ~10.9k stars — surfaced while
    investigating Tencent's managed AGS service, which press coverage says
    runs on this engine. Combines three properties usually found separately:
    hardware VM isolation, credential brokering, and sub-second CoW
    snapshot/rollback — the closest self-hosted analog to mitos's fork model,
    at much larger scale and with an E2B-compatible API.
  isolation_tier: microvm
  adoption_effort: install
  deployment_model: self-hosted

- name: forkd
  category: self-hosted-platform
  maintainer: deeplethe
  open_source: true
  license: Apache-2.0
  url: https://github.com/deeplethe/forkd
  repo_url: https://github.com/deeplethe/forkd
  description: Firecracker fork server that spawns child microVMs from a paused, warmed parent snapshot via MAP_PRIVATE kernel copy-on-write, for fan-out of KVM-isolated agent sandboxes.
  isolation_type: [microvm, kvm]
  capabilities:
    - Children mmap the parent memory image MAP_PRIVATE; pages are shared until written
    - BRANCH pauses a running sandbox, snapshots in-flight state, and forks it mid-execution (Diff and v0.4 live modes)
    - Diff-snapshot chains with parent_tag and content-hash edges; snapshot-compact flattens a chain
    - Per-child network namespace, cgroup v2 memory.max, vmgenid-reseeded /dev/urandom
    - REST API with bearer-token auth, Python and TypeScript SDKs, MCP server (pip install forkd-mcp)
    - Prometheus /metrics, append-only JSON audit log, systemd unit
    - Snapshot Hub registry for pulling prebuilt portable snapshots
  requirements:
    - x86_64 Linux with KVM (Ubuntu 22.04 or newer); cgroup v2
    - "Live BRANCH: Linux >= 5.7 with vm.unprivileged_userfaultfd=1 (or CAP_SYS_PTRACE) and the vendored deeplethe/firecracker fork"
    - Root (sudo) for fork and network setup
  limitations:
    - "Vendor claims: 100 microVMs forked in 101 ms wall-clock and live BRANCH pause window of 56 ms p50 on a 1.5 GiB source; measured by the maintainers on their own host, not independently reproduced"
    - Diff-snapshot chains add a per-link spawn cost the maintainers measure at roughly 450-700 ms per layer on a 512 MiB base (SHA-256 verification); flat spawn is 59 ms
    - Snapshots are not portable across Firecracker versions or host CPU microarchitectures; live BRANCH requires a patched Firecracker rather than upstream
    - CLI daemon-side spawn and live BRANCH do not yet compose (README cites issue 209); default branch is dev
  notes: >-
    Created 2026-05; two primary committers account for nearly all commits. The distinguishing
    primitive is fork-from-warm at the VMM level: Modal offers the same primitive as a closed
    service, and CubeSandbox and Firecracker itself offer only cold boot. Compared with
    microsandbox (libkrun, local-first) and agent-glovebox (Docker sbx microVM), forkd targets
    many short-lived children sharing one warmed parent rather than one long-lived sandbox per
    user. The README publishes its own comparison benchmark against CubeSandbox, OpenSandbox,
    gVisor and Docker; treat all figures as vendor-run.
  isolation_tier: microvm
  adoption_effort: install
  deployment_model: self-hosted

- name: AgentENV
  category: self-hosted-platform
  maintainer: kvcache-ai (Moonshot AI)
  open_source: true
  license: MIT
  url: https://kvcache-ai.github.io/AgentENV/latest/
  repo_url: https://github.com/kvcache-ai/AgentENV
  description: Distributed Firecracker microVM environment platform, built to serve agentic RL training for Kimi K3, with lazy overlaybd image loading, incremental snapshot/fork, and an E2B-compatible HTTP API.
  isolation_type: [microvm, kvm]
  capabilities:
    - Firecracker microVMs scheduled across machines; single-node install via script or Docker image
    - OCI images loaded on demand through overlaybd with local disk as a bounded cache
    - Incremental memory and filesystem snapshots; running environments fork into independent sandboxes
    - Snapshots persist to S3-compatible object storage or a shared distributed filesystem
    - Memory ballooning returns reclaimable guest memory to the host
    - E2B-compatible HTTP API; standard E2B Python and TypeScript SDKs work by pointing E2B_API_URL at the server
    - aenv CLI (pull, start, exec, pause, resume, timeout, delete) for Linux and macOS
  requirements:
    - Linux kernel 6.8+ with /dev/kvm on sandbox hosts (a PVM deployment guide covers hosts without KVM)
    - API key generated on first server start; Docker Compose or Kubernetes for cluster deployment
  limitations:
    - "Vendor claims from the Kimi K3 tech report: 1.5 million images in production, 9.6x memory overcommit, boot or resume under 50 ms, incremental snapshot under 100 ms; none independently verified"
    - README warns the API authenticates but does not encrypt traffic; HTTPS must be terminated at a reverse proxy
    - Created 2026-07; open-source release is recent relative to its claimed internal production use
  notes: >-
    Provenance is the kvcache-ai group (KTransformers, Mooncake) at Moonshot AI; the README states it
    powers Kimi K3 agentic RL training. It is the second open-source E2B-API-compatible Firecracker
    control plane in this list after E2B's own infra, and unlike Dormice (single machine, gVisor) and
    k8e (Kubernetes) it targets multi-host clusters with object-storage-backed snapshots. The lazy
    overlaybd image path and balloon-driven overcommit are the design points that distinguish it
    from CubeSandbox and forkd, both of which assume images resident on the node.
  isolation_tier: microvm
  adoption_effort: install
  deployment_model: self-hosted

- name: k7
  category: self-hosted-platform
  maintainer: Katakate
  open_source: true
  license: Apache-2.0
  url: https://docs.katakate.org
  repo_url: https://github.com/Katakate/k7
  description: Self-hosted K3s-based platform provisioning lightweight VM sandboxes through three switchable backends (Kata+Firecracker, Kata+QEMU, custom k7d VMM) with CLI, REST API, and Python SDK.
  isolation_type: [kata, microvm, kvm]
  capabilities:
    - Backends selectable per sandbox with k7 create --backend kfd|kql|k7d; k7 install provisions K3s, Kata, Firecracker+jailer, QEMU, Longhorn, k7d
    - k7d backend forks a running sandbox's disk and memory copy-on-write (k7 fork) and pauses/resumes VMs in place
    - kql backend stores root disks on replicated Longhorn PVCs with named snapshots, restore, and cross-node mobility
    - Cilium CNI with FQDN egress policies; per-sandbox egress_whitelist in k7.yaml
    - Docker build/run inside sandboxes via a docker sidecar on all three backends
    - Multi-node clustering through Ansible inventories (2-node and 3-node HA shapes)
    - REST API (Docker Compose) and pip install k7-sdk sync/async client
  requirements:
    - Ubuntu host (amd64 or arm64; k7d is amd64 only) with /dev/kvm; kfd needs a spare raw disk for the devmapper thin-pool
    - Ansible for the installer; Docker and Docker Compose for the API
  limitations:
    - "README: Katakate is currently in beta and under security review. Use with caution for highly sensitive workloads"
    - "Vendor claims: k7d VM CoW fork in ~5 ms at the VMM and ~2.4 s end-to-end to a Ready pod; kql fork 46.7 s; measured by the maintainer on one Hetzner AX41 node"
    - Installation may overwrite existing K3s, Kata, Firecracker, QEMU/Kata, or Longhorn installations on the node
    - Single primary committer (26 of 29 contributions)
  notes: >-
    Reached number one on Show HN in 2025-10. It sits between kubernetes-sigs Agent Sandbox (CRDs
    only, bring your own cluster) and netclode (a fixed Kata+Cloud Hypervisor stack for coding
    agents): k7 installs the cluster itself and lets the operator pick the VMM per sandbox. The
    k7d backend (separate Katakate/k7d repo) is a custom KVM VMM added for warm fork, the same
    primitive forkd builds on Firecracker; k7 wraps it in a containerd shim so Kubernetes still
    schedules the sandbox.
  isolation_tier: microvm
  adoption_effort: compose
  deployment_model: self-hosted

- name: cocoon sandbox
  category: self-hosted-platform
  maintainer: cocoonstack
  open_source: true
  license: AGPL-3.0
  url: https://cocoonstack.github.io/sandbox/
  repo_url: https://github.com/cocoonstack/sandbox
  description: Bare-metal microVM control plane (sandboxd) with an in-guest Rust daemon (silkd) reached over vsock, running Cloud Hypervisor guests from EROFS layers with warm pools, fork, and hibernate.
  isolation_type: [microvm, kvm]
  capabilities:
    - Per-node sandboxd with warm pools refilled from golden snapshot exports; memberlist mesh redirects claims to the owning node
    - silkd in-guest daemon over vsock 2048 provides exec, persistent shell sessions, streaming fs, tar push/pull, watch, pty, structured git, port relay, and an LSP broker
    - net=none default has no NIC (vsock-only I/O); net=egress attaches a bridge/CNI NIC
    - Claim, release, hibernate, fork, promote, checkpoint HTTP API; usage and audit journals; /metrics
    - Guest boots from a PVH ELF kernel and static Rust initramfs mounting EROFS layers under overlayfs with ext4 COW
    - Go SDK, stdlib-only Python SDK, MCP stdio server, OpenAI Agents SDK provider, LangChain toolkit
    - Read-only or writable operator-catalog dataset volumes; signed preview URLs
  requirements:
    - Linux bare-metal node with KVM running cocoon (cocoonstack/cocoon, MIT) and Cloud Hypervisor
    - Go toolchain (or prebuilt sandboxd) for the node; Docker to build boot and OS images
  limitations:
    - Created 2026-07; ~50 stars and two contributors (one with 316 of 321 commits) at inclusion
    - "Vendor claims: warm pool hit 0.2-0.7 ms, golden clone 26-39 ms, cold boot 215-400 ms, measured by the maintainers on a 16-core AMD bare-metal node; docs state nested-virt hosts are much slower"
    - Server stack (sandboxd, silkd, boot chain, OS images, MCP server) is AGPL-3.0; only the client SDKs are Apache-2.0
    - Node pool retuning is Go-SDK only; Python SDK covers the guest and data-plane surface
  notes: >-
    The vsock-only default is the distinguishing security posture: a sandbox with no network device
    at all, with every byte relayed through sandboxd, whereas Arrakis, forkd and k7 give each guest a
    tap or CNI NIC by default. The underlying cocoon engine (Cloud Hypervisor, reflink snapshot and
    clone, MIT) is a separate repo created 2026-02. Fork and checkpoint branching from LangChain
    tools overlap Arrakis's snapshot-and-restore backtracking, on a much newer and less adopted
    codebase.
  isolation_tier: microvm
  adoption_effort: compose
  deployment_model: self-hosted

- name: Arrakis
  category: self-hosted-platform
  maintainer: abshkbh (Abhishek Bhardwaj)
  open_source: true
  license: AGPL-3.0
  url: https://github.com/abshkbh/arrakis
  repo_url: https://github.com/abshkbh/arrakis
  description: Self-hosted Cloud Hypervisor microVM sandbox server with overlayfs-protected rootfs, snapshot-and-restore for agent backtracking, and a VNC desktop with Chrome for computer use.
  isolation_type: [microvm, kvm]
  capabilities:
    - arrakis-restserver daemon with REST API to start, stop, snapshot, restore, destroy VMs; Go CLI client
    - Snapshot-and-restore preserves running processes and modified files for backtracking
    - Each guest runs Ubuntu with a code-execution service and VNC server at boot; Chrome preinstalled
    - Automatic host port forwarding to guest services including the VNC GUI
    - Python SDK (py-arrakis) and a separate MCP server repo (arrakis-mcp-server)
    - Dockerfile-based rootfs customization; prebuilt kernel or bring your own
    - Per-sandbox tap device on a host Linux bridge; ssh into guests
  requirements:
    - Linux host with /dev/kvm (Cloud Hypervisor); GCP setup guide provided
    - Root to run arrakis-restserver
  limitations:
    - Last commit 2025-06; 15 months idle at inclusion
    - AGPL-3.0 with a commercial license offered by email; contributors must sign a CLA granting dual licensing
    - Restored VMs reuse the original IP, so the original must be stopped or destroyed before restoring on the same host
    - Solo maintainer (239 of 240 commits); guest ships a default ssh password in the rootfs Dockerfile
  notes: >-
    One of the earliest (2024-08) self-hosted microVM sandboxes built specifically around agent
    backtracking; its snapshot-and-restore predates the fork primitives in forkd, k7 and cocoon
    sandbox. It pairs a code-execution sandbox with a GUI desktop in one VM, which puts it nearer
    cua and pixels than E2B. The 15-month gap in commits and the AGPL plus CLA arrangement are the
    two reasons to prefer an actively maintained alternative for new deployments.
  isolation_tier: microvm
  adoption_effort: install
  deployment_model: self-hosted

- name: Dormice
  category: self-hosted-platform
  maintainer: BitMiracle-AI
  open_source: true
  license: Apache-2.0
  url: https://github.com/BitMiracle-AI/Dormice
  repo_url: https://github.com/BitMiracle-AI/Dormice
  description: Single-machine sandbox daemon running agent sandboxes as Docker containers under gVisor (runsc), with an idle-cooling lifecycle (active, frozen, stopped, S3-archived) and an E2B-compatible API.
  isolation_type: [container, gvisor]
  capabilities:
    - acquireSandbox(userKey) is idempotent; the same key returns the same sandbox from any lifecycle state
    - Lifecycle active to frozen to stopped to archived, with any acquire bringing the sandbox back
    - Frozen sandboxes suspend processes mid-flight and resume them; memory swapped out via vm.swappiness=100
    - Optional cold archive to any S3-compatible bucket as tar plus zstd, with restore progress reported on acquire
    - E2B protocol served on /e2b/api and /e2b/envd; the unmodified official e2b npm package works with two URL changes
    - TypeScript SDK, dor CLI, web console, and an installable Agent Skill (npx skills add BitMiracle-AI/Dormice)
    - Single daemon with a SQLite ledger; no Kubernetes or external database
  requirements:
    - Bare Ubuntu/Debian x86_64 host with root, Docker, and gVisor runsc; swap enabled with vm.swappiness=100
    - Node 22+ for the daemon; zstd for archiving
  limitations:
    - "README: Status: early development ... Nothing here is ready for production yet"
    - Single-machine only by design; no multi-node scheduling
    - E2B template builds (e2b template build) are not implemented; templates are Docker images registered with dor template add
    - Network hardening (blocking the cloud metadata range, disabling inter-container traffic) is left to the operator; the README calls it not optional
  notes: >-
    Created 2026-07 with one primary committer (182 of 197 commits). The design inverts the
    disposable-sandbox model of E2B, Daytona and Modal: sandboxes are permanent and get cheaper the
    longer they idle, which suits one resident agent per user. Compared with AgentENV and k8e, the
    other E2B-API-compatible self-hosted entries, Dormice uses gVisor containers rather than microVMs
    and runs on one box; the README's measured figures (freeze to ~5 MiB RSS, ~50 ms wake) are the
    maintainers' own.
  isolation_tier: container
  adoption_effort: install
  deployment_model: self-hosted

- name: Judge0
  category: self-hosted-platform
  maintainer: Herman Zvonimir Dosilovic (judge0)
  open_source: true
  license: GPL-3.0
  url: https://judge0.com
  repo_url: https://github.com/judge0/judge0
  description: Self-hostable online code-execution system running each submission under ioi/isolate (namespaces plus cgroups) inside Docker worker containers, behind a queued REST API supporting 90+ languages.
  isolation_type: [container, user-namespace]
  capabilities:
    - HTTP JSON API for submissions with configurable time, memory, and output limits; webhooks on completion
    - ioi/isolate sandbox per submission with limits set through judge0.conf
    - Network access per submission disabled by default and toggleable (ENABLE_NETWORK, ALLOW_ENABLE_NETWORK)
    - Multi-file program (project) submissions and additional files alongside the user program
    - Docker Compose deployment with PostgreSQL and Redis; official Python SDK (pip install judge0)
    - Hosted Judge0 Cloud available via RapidAPI or direct contract
  requirements:
    - Linux host with Docker and Docker Compose; README recommends Ubuntu 22.04 with systemd.unified_cgroup_hierarchy=0 (cgroup v1)
  limitations:
    - CHANGELOG v1.13.1 (2024-04) fixes three sandbox vulnerabilities in versions <= 1.13.0, CVE-2024-28185, CVE-2024-28189 (symlink handling) and CVE-2024-29021
    - Last tagged release v1.13.1 dated 2024-04-18; commits continue through 2026-08 but no release has shipped since
    - Isolation is namespaces plus cgroups on a shared host kernel, weaker than the microVM entries; the deployment requires legacy cgroup v1
    - Self-hosted instances collect telemetry by default (TELEMETRY.md)
  notes: >-
    Judge0 predates the agent-sandbox category (2017) as an online-judge backend and now markets
    itself for AI-generated code; the README lists many educational and interview platforms as
    adopters. MCP servers exist only as community projects, not in the judge0 org. Its nearest
    entries are llm-sandbox (Docker/Podman per snippet) and nsjail-style process isolation; unlike
    both it ships a queue, database, and multi-language compiler image as a complete service.
  isolation_tier: container
  adoption_effort: install
  deployment_model: self-hosted

