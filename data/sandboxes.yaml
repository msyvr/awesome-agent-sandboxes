- name: Islo
  category: cloud-managed
  maintainer: Islo Labs (team behind Incredibuild)
  open_source: false
  license: null
  url: https://islo.dev
  repo_url: https://github.com/islo-labs/skills
  description: Hosted computers for autonomous coding agents, each a dedicated microVM behind an egress gateway that injects credentials into outbound requests so secrets never enter sandbox memory, with orchestration for ticket-to-PR workflows.
  isolation_type: [microvm]
  capabilities:
    - Dedicated microVM per computer (docs comparison table lists "Hardware-level – dedicated microVM" against "shared kernel" dev environments)
    - "Egress gateway credential injection: sandbox sends a placeholder (Bearer $GITHUB_TOKEN) and the gateway substitutes the real token at egress, with per-request audit"
    - Egress allowlists/blocklists (e.g. allow a preview stack, block production APIs) and content filters on egress
    - Persistent computers that keep state across disconnects; default size 2 vCPU / 4 GB RAM / 10 GB SSD
    - Multi-stage "factory line" orchestration for unattended agent runs (tests, PR review, bug fixes, migrations)
    - Deployment in Islo cloud, the customer's cloud (BYOC / own VPC), or the customer's customers' cloud
    - MCP server and agent skills for Cursor, Claude Code, and Codex
  requirements:
    - Islo account (sign-up credits, no credit card)
  limitations:
    - VMM not named anywhere on the site or docs; "dedicated microVM" is the only isolation statement
    - Platform is proprietary; the only public repo (islo-labs/skills, MIT) contains agent skills and plugin metadata, no runtime code
    - Billing is usage-based at hourly rates ($0.07/CPU-hour, $0.04/GB-hour, $0.0007/GB-hour storage); the site says "pay only while it runs" but does not state per-second granularity
    - New product (skills repo created 2026-07); no public adoption figures
  notes: >-
    Closest to nono and agent-glovebox in intent (credentials never reach the
    agent) but delivered as a hosted service: the gateway rewrites tokens at the
    network edge, whereas nono proxies from the host and Docker Sandboxes /
    E2B expose secrets as environment variables. Compared with E2B and Daytona,
    Islo bundles the orchestration layer (queues, webhooks, PR return) rather
    than only the sandbox API. Built by the Incredibuild team; the product
    page lists Incredibuild's enterprise customers, not Islo's.
  isolation_tier: microvm
  adoption_effort: sign-up
  deployment_model: cloud

