  category: abstraction
  maintainer: Kiln AI
  open_source: true
  license: MIT
  url: https://github.com/Kiln-AI/Kilntainers
  repo_url: https://github.com/Kiln-AI/Kilntainers
  description: Python MCP server exposing one sandbox_exec tool that gives each MCP connection its own ephemeral Linux sandbox on Docker/Podman, Modal, E2B, or a WASM (go-busybox) backend.
  isolation_type: [container, microvm, wasm]
  capabilities:
    - One sandbox per MCP connection, created on first sandbox_exec and destroyed when the connection closes
    - Backends selectable by flag (--backend docker|e2b|modal|go_busybox|wasm); any OCI image for Docker/Podman, GPU and region options on Modal
    - stdio transport for a single local sandbox or HTTP transport hosting many sandboxes with idle session timeout
    - Network disabled in sandboxes by default (--network to enable); per-exec timeout and 2 MiB output cap
    - Docker CPU and memory limits and passthrough of extra docker run flags; remote Docker host via --docker-host
    - WASM backends with memory cap and instruction fuel limit
    - Agent runs outside the sandbox and reaches it only over MCP, so agent API keys and prompts never enter it
  requirements:
    - Python 3.13+ (uv tool install kilntainers)
    - Docker or Podman for the default backend; Modal or E2B account for cloud backends
  limitations:
    - Last commit 2026-03; 6 months idle at inclusion
    - WASM backend is go-busybox only (grep, awk, sed, and similar), marked experimental, and is not a full Linux environment
    - Isolation strength is whatever the chosen backend provides; the Docker backend adds no gVisor, seccomp, or capability hardening beyond docker run defaults
    - Single tool surface (shell exec); no file transfer, port exposure, or snapshot API
  notes: >-
    The agent talks to the sandbox over MCP rather than running inside it, which places Kilntainers
    beside llm-sandbox and the E2B/Modal SDKs as a code-execution abstraction, not beside the agent
    wrappers such as nono or Docker Sandboxes. Compared with llm-sandbox it is protocol-level (any
    MCP client, not a Python API) and adds Modal, E2B, and WASM backends behind one flag. Backed by
    Kiln AI as a companion to their Kiln product; about 50 GitHub stars at inclusion.
  isolation_tier: container
  adoption_effort: install
  deployment_model: local

