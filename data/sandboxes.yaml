    - Relies on deprecated sandbox-exec; single maintainer
    - Repository archived 2026-08-18; README declares the CLI discontinued in favor of the proprietary BX.app (bx-ai.eu). The npm package still installs and runs, but receives no fixes
  notes: >-
    The only Seatbelt wrapper here that targets whole GUI IDEs rather than
