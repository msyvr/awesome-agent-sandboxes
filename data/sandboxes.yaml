    - Firecracker microVMs nested inside the Linux guest for disposable agent sandboxes
    - x86-64 binaries translated inside the guest by FEX
    - macOS guest VMs cloned copy-on-write for throwaway instances
  requirements:
    - Apple Silicon Mac; sandboxes need M3 or newer with macOS 15+ (nested virtualization)
    - Homebrew or install script (get.arcbox.dev); Rust 1.96+ to build
  limitations:
    - '"In public beta" per the README'
    - Sandbox feature requires nested virtualization (M3+, macOS 15+), excluding M1/M2 hosts
    - "Vendor claims \"Cold boot <1.5 s\" and \"Warm boot <500 ms\"; not independently measured"
    - macOS guests require APFS storage
  notes: >-
    Broader than a sandbox: an OrbStack-style Docker/Kubernetes/VM runtime for macOS with agent sandboxing
    as one subsystem, which is why it sits under dev-environment rather than standalone. The nested
    Firecracker-in-Hypervisor.framework design is unique among the macOS entries here (vibe, shuru, chamber
    all run a single VZ layer). Compare Docker Sandboxes (listed), which also wraps agents in a
    Docker-adjacent microVM but without k3s or macOS guests. Roughly 2.9k GitHub stars (2026-09).
  isolation_tier: hardware-vm
  adoption_effort: install
  deployment_model: local

