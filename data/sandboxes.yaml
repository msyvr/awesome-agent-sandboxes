  open_source: false
  license: null
  url: https://leap0.dev
  repo_url: https://github.com/leap0-dev
  description: Hosted Firecracker microVM sandboxes with a jailed VMM process, memory-plus-disk snapshots, per-sandbox egress firewall with host-side header injection, and an XFCE desktop for code execution, browser, and desktop automation.
  isolation_type: [microvm, kvm]
  capabilities:
    - Firecracker microVM per sandbox with a dedicated Linux 6.1 LTS guest kernel
    - "VMM process hardening (vendor statement): Firecracker launched via the Jailer with chroot, cgroup v2, seccomp filters, and unique UID/GID pairs"
    - Snapshots capture in-memory execution state plus writable disk; restore creates a new sandbox from a named checkpoint
    - "Egress firewall modes allow-all / deny-all / custom with allow_domains, allow_cidrs, and per-domain header transforms that inject credentials host-side"
    - Full XFCE desktop at 1440x900 with screenshot, mouse, keyboard, and screen recording
    - Python, TypeScript/JavaScript, and Go SDKs; MCP server; LangChain (Python and JS), Google ADK plugin, and a Mastra coding-agent template
    - "Vendor claims sandboxes boot in around 100ms"
