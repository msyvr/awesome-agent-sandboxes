    - Only connections to domains with transform rules are TLS-terminated; other allowed domains pass as opaque tunnels, so header transforms cannot be applied to them
  notes: >-
    Functionally the nearest hosted peer to E2B (Firecracker, Python/TS SDKs,
    snapshots), adding a firewall that injects credentials at the host like
    agent-glovebox's credential scoping, and a bundled desktop like cua and
    pixels. The jailer hardening statement (chroot, cgroup v2, seccomp, unique
    UID/GID) is more specific than most hosted vendors publish; it is the
    Firecracker Jailer's documented feature set and is stated by the vendor,
    not independently verified. SDKs, MCP server, and integrations are
