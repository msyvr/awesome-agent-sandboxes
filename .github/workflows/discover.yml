name: Discover New Sandboxes

on:
  schedule:
    # Daily at 9am UTC (switch to weekly "0 9 * * 1" once stable)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py --token "$GITHUB_TOKEN" --output-dir /tmp/discover-output

      - name: Create PR for new candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/discover-output/candidates.md ]; then
            CANDIDATE_COUNT=$(python -c "import json; print(len(json.load(open('/tmp/discover-output/candidates.json'))))")
            if [ "$CANDIDATE_COUNT" -gt "0" ]; then
              BRANCH="discover/$(date +%Y-%m-%d)"
              git checkout -b "$BRANCH"
              cp /tmp/discover-output/candidates.md temp/latest-candidates.md 2>/dev/null || true
              git add -A
              git commit -m "chore: discovery run $(date +%Y-%m-%d) — $CANDIDATE_COUNT candidates"
              git push origin "$BRANCH"
              gh pr create \
                --title "New sandbox candidates ($(date +%Y-%m-%d))" \
                --body "$(cat /tmp/discover-output/candidates.md)" \
                --label "discovery"
            fi
          fi

      - name: Create issue for staleness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/discover-output/staleness.md ]; then
            if grep -q "Found [1-9]" /tmp/discover-output/staleness.md; then
              gh issue create \
                --title "Staleness detected ($(date +%Y-%m-%d))" \
                --body "$(cat /tmp/discover-output/staleness.md)" \
                --label "staleness"
            fi
          fi

  lens-review:
    # Quarterly: first Monday of Jan, Apr, Jul, Oct
    if: github.event.schedule == '0 9 * * 1' && (github.event.repository.updated_at == '' || true)
    runs-on: ubuntu-latest
    steps:
      - name: Check if quarterly
        id: check
        run: |
          MONTH=$(date +%-m)
          DAY=$(date +%-d)
          if ([ "$MONTH" = "1" ] || [ "$MONTH" = "4" ] || [ "$MONTH" = "7" ] || [ "$MONTH" = "10" ]) && [ "$DAY" -le "7" ]; then
            echo "quarterly=true" >> "$GITHUB_OUTPUT"
          else
            echo "quarterly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create lens review issue
        if: steps.check.outputs.quarterly == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Quarterly lens review ($(date +%Y-Q$(( ($(date +%-m) - 1) / 3 + 1 )))" \
            --body "## Quarterly Lens Review

          Review the Quick Triage lens tables in the README for accuracy:

          - [ ] **Isolation tiers**: Are entries categorized at the right isolation level?
          - [ ] **Adoption effort**: Are the effort levels still accurate? Any tool become easier/harder to set up?
          - [ ] **Deployment model**: Any entries change where they run?
          - [ ] **New entries**: Do recently added entries have correct lens tags?
          - [ ] **Removed/deprecated entries**: Should any be removed from the lenses?

          This is a nudge, not a blocker. Address when convenient." \
            --label "lens-review"
